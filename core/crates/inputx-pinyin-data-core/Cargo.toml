[package]
name = "inputx-pinyin-data-core"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Embedded core Mandarin Pinyin dictionary (inputx-fsa Dict format) for the inputx-pinyin engine — single byte slice, zero deps, include_bytes-loaded. Required dependency of inputx-pinyin."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
keywords = ["pinyin", "ime", "chinese", "data", "embedded"]
categories = ["text-processing", "internationalization"]

[lib]
crate-type = ["rlib"]

[dependencies]
