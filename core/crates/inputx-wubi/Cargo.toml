[package]
name = "inputx-wubi"
version = "1.4.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Self-developed Wubi 86 encoder, dictionary, and dataset — zero-dependency, self-built finite-state index (inputx-fsa), WASM-ready. Powers the Inputx IME."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
documentation = "https://docs.rs/inputx-wubi"
readme = "README.md"
keywords = ["wubi", "ime", "chinese", "input-method", "fst"]
categories = ["text-processing", "internationalization", "encoding"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# 2026-06-03 治理: `tools` feature retired since fetch_corpus/build_weights
# pipeline binaries are gone. Remaining wubi tools (gen-dict / verify /
# auto-decomp / import-*) are zero-dep.

[dependencies]
# Self-built zero-dependency index — replaces fst (two-level Dict: code →
# [(word, packed layer|freq)]). See .claude/PLAN-self-built-fsa.md.
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }
# Lock-free swap of the code→candidates map, so a polish rebuild can
# replace the table under a running IME without exiting — and without
# disturbing the L0 layer (pins / prefs) sitting beside it.
arc-swap = "1"

[build-dependencies]
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bin]]
name = "wubi-emit-dict"
path = "tools/emit_dict.rs"

[[bin]]
name = "wubi-gen-dict"
path = "tools/gen_dict.rs"

[[bin]]
name = "wubi-verify"
path = "tools/verify.rs"

[[bin]]
name = "wubi-auto-decomp"
path = "tools/auto_decomp.rs"

[[bin]]
name = "wubi-import-simplified"
path = "tools/import_simplified.rs"

[[bin]]
name = "wubi-import-phrases"
path = "tools/import_phrases.rs"

[[bench]]
name = "lookup"
harness = false

[lints]
workspace = true
