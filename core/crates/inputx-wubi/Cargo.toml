[package]
name = "inputx-wubi"
version = "1.2.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Self-developed Wubi 86 encoder, dictionary, and dataset — zero-dependency, self-built finite-state index (inputx-fsa), WASM-ready. Powers the Inputx IME."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
documentation = "https://docs.rs/inputx-wubi"
readme = "README.md"
keywords = ["wubi", "ime", "chinese", "input-method", "fst"]
categories = ["text-processing", "internationalization", "encoding"]

[lib]
name = "wubi"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# Pulls in the corpus pipeline binaries (`wubi-fetch-corpus`,
# `wubi-build-weights`) and their heavyweight deps. Library consumers don't
# need this; only maintainers regenerating `data/weights/weights.tsv` do.
tools = [
    "dep:ureq", "dep:aho-corasick", "dep:toml", "dep:sha2",
    "dep:serde", "dep:flate2", "dep:bzip2-rs", "dep:tar",
    "dep:encoding_rs",
]

[dependencies]
# Self-built zero-dependency index — replaces fst (two-level Dict: code →
# [(word, packed layer|freq)]). See .claude/PLAN-self-built-fsa.md.
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

# tools-only deps (gated behind `tools` feature)
ureq = { version = "2", optional = true }
aho-corasick = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
# Pure-Rust gzip (rust_backend = no zlib system dep). Used by build_weights
# to read .gz corpora.
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
# Pure-Rust bzip2 decompressor — no libbz2 system dep.
bzip2-rs = { version = "0.1", optional = true }
# Pure-Rust tar archive reader (Leipzig corpora ship as `.tar.gz`).
tar = { version = "0.4", optional = true, default-features = false }
# WHATWG-spec encoding decoder (handles GB18030 / GBK / Big5 / Shift_JIS for
# pre-2015 corpora that aren't UTF-8). Used by build_weights.rs.
encoding_rs = { version = "0.8", optional = true }

[build-dependencies]
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bin]]
name = "wubi-gen-dict"
path = "tools/gen_dict.rs"

[[bin]]
name = "wubi-verify"
path = "tools/verify.rs"

[[bin]]
name = "wubi-auto-decomp"
path = "tools/auto_decomp.rs"

[[bin]]
name = "wubi-import-simplified"
path = "tools/import_simplified.rs"

[[bin]]
name = "wubi-import-phrases"
path = "tools/import_phrases.rs"

[[bin]]
name = "wubi-fetch-corpus"
path = "tools/fetch_corpus.rs"
required-features = ["tools"]

[[bin]]
name = "wubi-build-weights"
path = "tools/build_weights.rs"
required-features = ["tools"]

[[bench]]
name = "lookup"
harness = false
