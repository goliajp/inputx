[package]
name = "inputx-pinyin-cement"
version = "1.4.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "[DEPRECATED 1.4.1 → see inputx-pinyin-helpers in v1.6 backlog] Pinyin IDF + NGM data + lookup helpers (bigram_boost, estimated_freq_from_log_prior, pinyin_idf_reader). The -cement suffix is a v1.4 taxonomy mis-naming — this crate ships pure data + stateless helpers (no application glue), classifies as a stone. Migration: depend directly on what you need."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
keywords = ["ime", "pinyin", "engine", "cement", "idfv1"]
categories = ["text-processing"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Pinyin facade — codec / dict / syllable / fuzzy / engine primitives.
inputx-pinyin = { workspace = true }
# IDFv1 dict reader + builder (v1.4.3 stone).
inputx-dict-format = { path = "../inputx-dict-format", version = "1.4" }
# NGMv1 n-gram lookup (v1.4.4 stone) for bigram_boost.
inputx-ngram = { path = "../inputx-ngram", version = "1.4" }
# Probability-native scoring schema (v1.4.2 stone). Source of truth
# for Q4 fixed-point constants used in `freq.rs` round-trip helpers.
inputx-scoring = { path = "../inputx-scoring", version = "1.4" }

[dev-dependencies]
tempfile = "3"
