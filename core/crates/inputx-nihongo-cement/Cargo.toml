[package]
name = "inputx-nihongo-cement"
version = "1.4.2"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "[DEPRECATED 1.4.1 → see inputx-nihongo-data-jukugo + inputx-nihongo-data-kanji in v1.6 backlog] Japanese IDF data + reader helpers. The -cement suffix is a v1.4 taxonomy mis-naming — this crate ships pure data + stateless helpers (no application glue), classifies as data stones."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
keywords = ["ime", "japanese", "jukugo", "kanji", "cement"]
categories = ["text-processing"]

[lib]
crate-type = ["rlib"]

[dependencies]
# v1.6 thin re-export shim: this crate now `pub use` both halves of
# the split (jukugo + kanji). Historical 1.4.x consumers continue to
# compile transparently; new code should depend on the matching
# `-data-jukugo` / `-data-kanji` stone(s) directly per use case.
inputx-nihongo-data-jukugo = { path = "../inputx-nihongo-data-jukugo", version = "1.6" }
inputx-nihongo-data-kanji = { path = "../inputx-nihongo-data-kanji", version = "1.6" }
