[package]
name = "inputx-nihongo-cement"
version = "1.4.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "[DEPRECATED 1.4.1 → see inputx-nihongo-data-jukugo + inputx-nihongo-data-kanji in v1.6 backlog] Japanese IDF data + reader helpers. The -cement suffix is a v1.4 taxonomy mis-naming — this crate ships pure data + stateless helpers (no application glue), classifies as data stones."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
keywords = ["ime", "japanese", "jukugo", "kanji", "cement"]
categories = ["text-processing"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Nihongo facade — romaji / kanji / jukugo / brands / counters /
# engine / session primitives.
inputx-nihongo = { path = "../inputx-nihongo", version = "1.1" }
# IDFv1 dict reader + builder (v1.4.3 stone).
inputx-dict-format = { path = "../inputx-dict-format", version = "1.4" }
# Probability-native scoring schema (v1.4.2 stone).
inputx-scoring = { path = "../inputx-scoring", version = "1.4" }
