[package]
name = "inputx-ngram"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "N-gram log-probability lookup table for IME engines — bigram / trigram / extensible. Q4 fixed-point log_prob, FST-indexed by context, mmap zero-copy. Same NGMv1 binary format across pinyin / wubi / Japanese."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
keywords = ["ime", "ngram", "bigram", "trigram", "log-probability"]
categories = ["data-structures", "text-processing"]

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = []

[dependencies]
inputx-fsa = { path = "../inputx-fsa", version = "1.3" }
memmap2 = "0.9"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
