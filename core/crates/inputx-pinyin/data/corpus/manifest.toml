# golia-pinyin corpus manifest.
#
# Each [corpus.<id>] block references a downloadable plain-text corpus
# (or a pre-aggregated frequency table — see `format` field).
# `pinyin-fetch-corpus` validates the SHA-256 after download;
# `pinyin-build-weights` scans the cached files to derive the per-(pinyin,
# word) frequency scores that get packed into the FST.
#
# Schema (mirrors inputx-wubi's corpus manifest exactly so entries can be
# reused between the two engines):
#   url         (string, required) — download URL; HTTPS strongly preferred
#   sha256      (string, required) — 64 hex chars; download fails if mismatch
#   weight      (float,  required) — mixing weight (relative; normalized at
#                                    scan time across all corpora)
#   license     (string, required) — informational, for compliance audits
#   description (string, required) — human-readable provenance note
#   format      (string, required) — one of: "plain", "gzip", "bzip2",
#                                    "tar_gz", "frequency_list"
#   encoding    (string, optional) — for non-UTF-8 sources; e.g. "gb18030"
#
# To add a corpus:
#   1. Run `cargo run --features tools --release --bin pinyin-fetch-corpus -- probe <url>`
#   2. Review the printed stanza, fill in the TBD fields, paste here.
#   3. Run `cargo run --features tools --release --bin pinyin-fetch-corpus`
#   4. Run `cargo run --features tools --release --bin pinyin-build-weights`
#   5. Commit the regenerated `weights.tsv` — that's a pinyin data-version bump.
#
# With zero entries, the build still works: weights.tsv is generated with
# all freq_score = 0, and ranking falls back to dict-listed reading order.

# --- corpus mixing weights ---
#
# Weight rationale (revised 2026-05-11 colloquial-first; kept at 3/3/3/1 for the
# 2026-05-25 CP3d-cutover HYBRID normalizer):
#
# An IME's primary input register is **conversational / colloquial** — users
# type chat messages, search queries, casual notes. Book / news corpora
# overweight formal vocabulary (proper nouns, jargon, Wikipedia entity titles
# like 合欢花 / 黄淮海 / 惠皇后) which can drown out frequent colloquial words.
#
# SUBTLEX (film subtitles) + LCCC (Weibo dialogues) are the colloquial signal;
# news + wiki provide written-register coverage. The three occurrence corpora
# sit at weight 3, wiki at 1 (it over-counts via its larger sentence set).
#
# IMPORTANT: the colloquial-vs-formal single-char tension (把/吧, 起/其, 发/法)
# is resolved by the HYBRID normalizer (03_normalize --mode hybrid, β=0.5 of
# sum-then-log + per-source-log-count), NOT by skewing these weights. Pure
# per-source-log-count needed news=1 to fix 吧, but that sank 中国's zho-prefix
# rank to 67 (out of top-30) by flattening cross-source magnitude; hybrid keeps
# 中国 at rk≈19 AND 吧 at #0 under plain 3/3/3/1. See 03_normalize/tune_weights.py.

[corpus.zho_subtlex_ch_wf]
url         = "https://raw.githubusercontent.com/leonsilicon/subtlex-ch-wf/main/data/SUBTLEX-CH-WF"
sha256      = "086536450b1f77d0c7ff3ac0fc8375897162ace807d3167bec48b4c493434077"
weight      = 3.0
license     = "CC-BY 4.0"
description = "SUBTLEX-CH-WF (Cai & Brysbaert 2010, PLOS ONE 10.1371/journal.pone.0010729) — Chinese word frequency from 33.5M chars of film subtitles; primary signal source for IME ranking (closest to colloquial input)"
format      = "frequency_list"
encoding    = "gb18030"

[corpus.zho_wikipedia_2018_1m]
url         = "https://downloads.wortschatz-leipzig.de/corpora/zho_wikipedia_2018_1M.tar.gz"
sha256      = "1fa674cd44842c16ee724f9c57d6b3a3cc4493e83e59b4fba2768213184fdfd4"
weight      = 1.0
license     = "CC-BY 4.0"
description = "Leipzig Corpora — 1M Chinese Wikipedia sentences (2018); secondary signal for encyclopedic / proper-noun vocab"
format      = "tar_gz"

[corpus.zho_news_2020_100k]
url         = "https://downloads.wortschatz-leipzig.de/corpora/zho_news_2020_100K.tar.gz"
sha256      = "ba219ac3a5b9e13f2653690ab67a03a184cab6019cbbb374791fd4cc7446a7e1"
weight      = 3.0
license     = "CC-BY 4.0"
description = "Leipzig Corpora — 100K Chinese news sentences (2020); secondary signal for modern (post-2018) news vocabulary"
format      = "tar_gz"

[corpus.zho_lccc_base]
url         = "https://huggingface.co/datasets/silver/lccc/resolve/main/lccc_base_train.jsonl.gz"
sha256      = "2162e0ed923fba62329cabf7e1493fbe59248afc94a62508e4abdea61e624627"
weight      = 3.0
license     = "MIT"
description = "LCCC-base (Large-scale Cleaned Chinese Conversation, thu-coai, 2020) — 6.8M Weibo/social-media dialogues (32.8M utterances, ~232M chars). Modern colloquial signal closest to the IME's primary register (chat). Fills the post-2010 colloquial gap that SUBTLEX-CH (2010 subtitles) and wiki/news (written) miss: 搞定/给力/吐槽 etc. jump from two-digit to thousands of occurrences. We redistribute only the irreversible derived word-frequency statistics, never the source text — same posture as SUBTLEX-CH (subtitle-derived freq table). jieba-tokenized utterances are de-spaced at scan time so Aho-Corasick matches multi-char words."
format      = "jsonl_dialog"
