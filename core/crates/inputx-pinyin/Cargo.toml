[package]
name = "inputx-pinyin"
version = "1.4.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Self-developed Mandarin Pinyin input method engine — segmenter, fuzzy syllables, zero-dependency self-built finite-state index (inputx-fsa) dict, WASM-ready. Powers the Inputx IME."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
documentation = "https://docs.rs/inputx-pinyin"
readme = "README.md"
keywords = ["pinyin", "ime", "chinese", "input-method", "fst"]
categories = ["text-processing", "internationalization", "encoding"]
# 2026-06-03 治理: heavy intermediate corpus files retired. The pinyin
# crate now publishes only the post-digest library + engine internals;
# library.tsv (13 MB) excluded from crates.io publish (consumers get
# the built pinyin.dict via inputx-pinyin-data-core stone).
exclude = [
    "data/library.tsv",
    # data/bootstrap.tsv stays IN the package — build.rs reads it
    # under the `bootstrap_only` feature to generate the tiny FST.
]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Self-built zero-dependency index — fully replaces fst on the pinyin read
# path (main dict = Dict, n-grams = Fsa). See .claude/PLAN-self-built-fsa.md.
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

# Embedded core pinyin.dict — split out of this crate's `data/` in
# v1.4.7 sub-phase B (Strategy C) so the facade stays under crates.io's
# per-crate upload limit. Required; not gated by a feature.
inputx-pinyin-data-core = { path = "../inputx-pinyin-data-core", version = "1.4" }

# Optional embedded bigram FSAs — `default-on` via the `bigrams`
# feature. Drop the dep entirely with `default-features = false` to
# publish-ship without the ~6 MB bigram blob (the facade still
# compiles: PinyinDict::bigram_boost returns 0 and Viterbi falls
# back to corpus-freq-only ordering).
inputx-pinyin-data-bigrams = { path = "../inputx-pinyin-data-bigrams", version = "1.4", optional = true }

# Optional embedded word-trigram dict — `default-on` via the
# `trigrams` feature. Drop with `default-features = false` to
# publish-ship without the ~13 MB trigram blob (the facade still
# compiles: PinyinDict::predict_next_words_context returns an empty
# Vec).
inputx-pinyin-data-trigrams = { path = "../inputx-pinyin-data-trigrams", version = "1.4", optional = true }

# tools-only deps (gated behind `tools` feature). Trimmed 2026-06-03
# 治理: the old corpus-ingest pipeline retired, so the fetch/decode
# crate of deps (ureq/aho-corasick/flate2/bzip2-rs/tar/encoding_rs/
# serde_json) is gone too. The remaining `pinyin-build-dict` +
# `pinyin-build-ngrams-fsa` only need toml/serde for read paths.
toml = { version = "0.8", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[build-dependencies]
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "lookup"
harness = false

[features]
default = ["bigrams", "trigrams"]
# v1.4.7 sub-phase B: opt-in feature flags for the bigrams / trigrams
# data stones. Both default-on so consumers writing `inputx-pinyin =
# "1.4"` get the full historical engine surface (bigram boost +
# context-aware next-word prediction) unchanged. Disable with
# `default-features = false` to shrink the dependency closure to just
# inputx-pinyin-data-core (the required ~4 MB exact-syllable dict).
bigrams = ["dep:inputx-pinyin-data-bigrams"]
trigrams = ["dep:inputx-pinyin-data-trigrams"]
# Maintainer-only tools (`pinyin-build-dict`, `pinyin-build-ngrams-fsa`).
# Library consumers don't need this.
tools = [
    "dep:toml",
    "dep:serde",
]
# Embed the small ~125-entry bootstrap FST instead of the full ~919k-entry
# corpus-derived dict. Reduces compile time + binary size by ~15-20MB.
# Use for fast unit tests and size-sensitive targets (wasm32 lands proper
# treatment in item 33 of workspace ROADMAP).
bootstrap_only = []

[[bin]]
name = "pinyin-build-dict"
path = "tools/build_dict.rs"
required-features = ["tools"]

[[bin]]
name = "pinyin-build-ngrams-fsa"
path = "tools/build_ngrams_fsa.rs"
required-features = ["tools"]

# `[[bench]]` blocks land in v0.2 once data is dense enough to bench.
