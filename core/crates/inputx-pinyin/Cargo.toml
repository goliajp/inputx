[package]
name = "inputx-pinyin"
version = "1.2.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Self-developed Mandarin Pinyin input method engine — segmenter, fuzzy syllables, zero-dependency self-built finite-state index (inputx-fsa) dict, WASM-ready. Powers the Inputx IME."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
documentation = "https://docs.rs/inputx-pinyin"
readme = "README.md"
keywords = ["pinyin", "ime", "chinese", "input-method", "fst"]
categories = ["text-processing", "internationalization", "encoding"]
# Heavy intermediate data files: regeneratable from
# tools/{fetch_unihan,fetch_jieba_dict,fetch_corpus,build_weights,build_fst}.
# Excluding them keeps the published crate under crates.io's size cap.
# Maintainers regenerate locally; the canonical FST `data/pinyin.fst` IS
# included (15 MB) and is the single source of truth for the published dict.
exclude = [
    "data/unihan/",
    "data/jieba/",
    "data/corpus/cache/",
    "data/readings_unihan.tsv",
    "data/phrases_jieba.tsv",
    "data/phrases_composed.tsv",
    "data/heteronyms_candidates.tsv",
    "data/readings.tsv",
    "data/weights/weights.tsv",
]

[lib]
name = "golia_pinyin"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Self-built zero-dependency index — fully replaces fst on the pinyin read
# path (main dict = Dict, n-grams = Fsa). See .claude/PLAN-self-built-fsa.md.
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

# tools-only deps (gated behind `tools` feature)
ureq = { version = "2", optional = true }
aho-corasick = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
# JSON parser — used by compose_phrase_readings to read pypinyin's
# phrases_dict.json (MIT-licensed per-char phrase readings, ~47k phrases).
serde_json = { version = "1", optional = true }
# Pure-Rust gzip (rust_backend = no zlib system dep). Used by build_weights.
flate2 = { version = "1", optional = true, default-features = false, features = [
    "rust_backend",
] }
# Pure-Rust bzip2 decompressor — no libbz2 system dep.
bzip2-rs = { version = "0.1", optional = true }
# Pure-Rust tar archive reader (Leipzig corpora ship as `.tar.gz`).
tar = { version = "0.4", optional = true, default-features = false }
# WHATWG-spec encoding decoder (handles GB18030 / GBK / Big5 for pre-2015
# corpora that aren't UTF-8). Used by build_weights.
encoding_rs = { version = "0.8", optional = true }

[build-dependencies]
inputx-fsa = { path = "../inputx-fsa", version = "1.1" }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "lookup"
harness = false

[features]
default = []
# Pulls in the maintainer-only tool binaries (`unihan-extract-readings`,
# `pinyin-fetch-corpus`, `pinyin-build-weights`, etc.) and their heavyweight
# deps. Library consumers don't need this; only data pipeline runs
# (ROADMAP items 14-22) do.
tools = [
    "dep:ureq",
    "dep:aho-corasick",
    "dep:toml",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "dep:flate2",
    "dep:bzip2-rs",
    "dep:tar",
    "dep:encoding_rs",
]
# Embed the small ~125-entry bootstrap FST instead of the full ~919k-entry
# corpus-derived dict. Reduces compile time + binary size by ~15-20MB.
# Use for fast unit tests and size-sensitive targets (wasm32 lands proper
# treatment in item 33 of workspace ROADMAP).
bootstrap_only = []

[[bin]]
name = "unihan-extract-readings"
path = "tools/build_readings_unihan.rs"
required-features = ["tools"]

[[bin]]
name = "compose-phrase-readings"
path = "tools/compose_phrase_readings.rs"
required-features = ["tools"]

[[bin]]
name = "find-heteronym-candidates"
path = "tools/find_heteronym_candidates.rs"
required-features = ["tools"]

[[bin]]
name = "merge-readings"
path = "tools/merge_readings.rs"
required-features = ["tools"]

[[bin]]
name = "pinyin-fetch-corpus"
path = "tools/fetch_corpus.rs"
required-features = ["tools"]

[[bin]]
name = "pinyin-build-weights"
path = "tools/build_weights.rs"
required-features = ["tools"]

[[bin]]
name = "pinyin-build-dict"
path = "tools/build_dict.rs"
required-features = ["tools"]

[[bin]]
name = "pinyin-build-ngrams-fsa"
path = "tools/build_ngrams_fsa.rs"
required-features = ["tools"]

# `[[bench]]` blocks land in v0.2 once data is dense enough to bench.
