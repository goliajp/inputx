[package]
name = "inputx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# `inputx-core` is now pure Rust — no extern "C", no wasm-bindgen. The
# C ABI lives in the sibling `inputx-core-ffi` crate, and a future
# `inputx-core-wasm` will mirror it for browsers. rlib only.
crate-type = ["rlib"]

[dependencies]
wubi = { workspace = true }
golia-pinyin = { workspace = true }
# JSON for the L0 export/import (item 45). Stays here even though the C
# ABI moved out, because the JSON schema is part of the engine surface
# (the FFI just exposes the already-serialized string).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Property-based fuzz testing — generates randomized op sequences and
# shrinks counterexamples. Used in composite::engine::tests::fuzz_*.
proptest = "1"
# Criterion — fine-grained perf measurement for the composite engine hot
# path. Complements (doesn't replace) the perfgate unit test, which gates
# regressions; criterion is for tuning + reporting.
criterion = "0.5"

[[bench]]
name = "composite"
harness = false
