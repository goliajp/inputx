[package]
name = "inputx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "inputx_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
wubi = { workspace = true }
golia-pinyin = { workspace = true }
# JSON for the L0 export/import FFI (item 45). Internal inputx-core dep —
# the underlying wubi + golia-pinyin libs stay serde-free per their
# published-crate design.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
# Property-based fuzz testing — generates randomized op sequences and
# shrinks counterexamples. Used in composite::engine::tests::fuzz_*.
proptest = "1"
# Criterion — fine-grained perf measurement for the composite engine hot
# path. Complements (doesn't replace) the perfgate unit test, which gates
# regressions; criterion is for tuning + reporting.
criterion = "0.5"

[[bench]]
name = "composite"
harness = false
