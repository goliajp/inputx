[package]
name = "inputx-wubi-cement"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Wubi-specific business glue (consumer-engine cement) for Inputx — stateful WubiEngine wrapping inputx-wubi facade primitives, L0 export/import JSON, auto-commit policy. Use this if you want a ready-to-drive Wubi IME engine; use `inputx-wubi` (the facade) if you just need the codec / dict / layer primitives."
authors = ["GOLIA K.K."]
repository = "https://github.com/goliajp/inputx"
homepage = "https://github.com/goliajp/inputx"
keywords = ["ime", "wubi", "engine", "cement"]
categories = ["text-processing"]

[lib]
crate-type = ["rlib"]

[dependencies]
# Wubi engine primitives (codec / decomp / dict / jianma / layer / stroke /
# zigen). This cement crate is the consumer of that facade.
inputx-wubi = { workspace = true }
# IDFv1 dict reader (v1.4.3 stone) — v1.4.7 sub-phase A4 step 2: wubi
# cement-level lookups (lookup_with_freq_layer / prefix_predictions)
# route through EMBEDDED_WUBI_IDF instead of the facade dict.
inputx-dict-format = { path = "../inputx-dict-format", version = "1.4" }
# Q4 fixed-point constants for log_prior reconstruction (used by
# downstream consumers, kept on cement-level to keep the facade dep
# graph minimal).
inputx-scoring = { path = "../inputx-scoring", version = "1.4" }
