name: CI

# Git-flow trigger model (no PRs). Run tests on pushes to the long-lived
# branches (develop, master), the release/hotfix integration branches, and
# version tags. feature/* and bugfix/* are finished locally via
# `git flow ... finish` and never pushed, so they're intentionally omitted.
on:
  push:
    branches:
      - develop
      - master
      - 'release/**'
      - 'hotfix/**'
    tags:
      - 'v*'

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust + Swift tests
    # macOS runner: the project is a macOS/iOS IME — the rust-toolchain.toml
    # targets are Apple/wasm, and the Swift (InputxKit) tests can only build
    # on macOS. Pinned (not -latest) for reproducibility; runner is arm64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      # Installs the stable toolchain + components/targets declared in
      # rust-toolchain.toml (rustfmt, clippy, apple + wasm targets).
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Fast formatting gate — fails before the slow compile if any Rust
      # source isn't rustfmt-clean. The hand-grouped syllable table is
      # exempted via #[rustfmt::skip] (see inputx-pinyin/src/syllable.rs).
      - name: rustfmt check
        run: cargo fmt --all --check
        working-directory: core

      # Clippy gate. Project lint policy lives in [workspace.lints.clippy]
      # (core/Cargo.toml) — only doc_lazy_continuation is allowed (math-prose
      # false positives); everything else is denied here.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core

      # Project-blessed Rust gate (inputx-scoring + inputx-core baseline +
      # inputx-core lib). Same target as `make baseline` locally.
      - name: Rust baseline tests
        run: make baseline

      # Produce libinputx_core.a (staticlib) + regenerate core/include/
      # inputx_core.h via the inputx-core-ffi build.rs / cbindgen, so the
      # Swift InputxCoreC system-library target can link. Host-arch build
      # (target/release) reuses the baseline compile cache.
      - name: Build core FFI staticlib
        run: cargo build -p inputx-core-ffi --release
        working-directory: core

      # InputxKit shared-layer tests (incl. the FFI integration tests that
      # call into the Rust session). -L points at the staticlib built above.
      - name: Swift (InputxKit) tests
        run: swift test -Xlinker -L../../core/target/release
        working-directory: platform/apple
