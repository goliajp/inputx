name: Inputx
options:
  bundleIdPrefix: jp.golia.inputx
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

# Shared Apple Swift layer (`platform/apple/`). InputxKit exposes the FFI
# wrapper (`InputxSession`), L0 storage helpers, locale helpers, and the
# `InputxSettings` types. Both targets below depend on it. Mac IME builds
# from the same `Package.swift` via `swift build`; iOS / Web / future
# Linux+Windows wrappers will each plug into the shared layer through
# their host-native package manager.
packages:
  InputxKit:
    path: ../platform/apple

settings:
  base:
    DEVELOPMENT_TEAM: KF79DRC524
    SWIFT_VERSION: "5.10"
    # Item 97 — App Store v1.0 release version. CURRENT_PROJECT_VERSION
    # increments per build (TestFlight / submission); MARKETING_VERSION
    # is the user-facing semver.
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    # Item 88/90 — wire the asset-catalog AppIcon set generated by
    # generate_appicon.py into both targets' build.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  InputxApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Keyboard
        excludes:
          # InputxApp doesn't need a second copy of Keyboard/Resources —
          # the embedded InputxKeyboard.appex carries fonts / OFL.txt.
          # Avoids "Multiple commands produce …" duplicate-resource errors.
          - "Resources"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.golia.inputx
        INFOPLIST_FILE: plists/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: plists/App.entitlements
        # InputxKit (Swift package) wraps the C header via its InputxCoreC
        # system-library module, so no bridging header / HEADER_SEARCH_PATHS
        # is needed at the host-target level anymore. The static link to
        # `libinputx_core.a` still happens here — the modulemap declares
        # `link "inputx_core"` but SPM's library search path differs from
        # the Rust release dir, so we set `LIBRARY_SEARCH_PATHS` explicitly.
        OTHER_LDFLAGS: -linputx_core
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../core/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../core/target/aarch64-apple-ios-sim/release
    dependencies:
      - target: InputxKeyboard
        embed: true
        codeSign: true
      - package: InputxKit

  InputxKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.golia.inputx.keyboard
        INFOPLIST_FILE: plists/Keyboard-Info.plist
        CODE_SIGN_ENTITLEMENTS: plists/Keyboard.entitlements
        OTHER_LDFLAGS: -linputx_core
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../core/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../core/target/aarch64-apple-ios-sim/release
    dependencies:
      - package: InputxKit
