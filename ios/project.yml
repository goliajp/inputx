name: Inputx
options:
  bundleIdPrefix: jp.golia.inputx
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: KF79DRC524
    SWIFT_VERSION: "5.10"
    # Item 97 — App Store v1.0 release version. CURRENT_PROJECT_VERSION
    # increments per build (TestFlight / submission); MARKETING_VERSION
    # is the user-facing semver.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    # Item 88/90 — wire the asset-catalog AppIcon set generated by
    # generate_appicon.py into both targets' build.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  InputxApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Keyboard
        excludes:
          - "InputxCore-Bridging-Header.h"
          # InputxApp doesn't need a second copy of Keyboard/Resources —
          # the embedded InputxKeyboard.appex carries fonts / OFL.txt. Avoids
          # "Multiple commands produce …" duplicate-resource build errors.
          - "Resources"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.golia.inputx
        INFOPLIST_FILE: plists/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: plists/App.entitlements
        # Same Rust core link config as InputxKeyboard — lets the host app
        # also instantiate KeyboardViewController + call inputx-core FFI for
        # the in-app debug keyboard view (item 92, maestro TDD).
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Keyboard/InputxCore-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        OTHER_LDFLAGS: -linputx_core
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../core/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../core/target/aarch64-apple-ios-sim/release
    dependencies:
      - target: InputxKeyboard
        embed: true
        codeSign: true

  InputxKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "InputxCore-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.golia.inputx.keyboard
        INFOPLIST_FILE: plists/Keyboard-Info.plist
        CODE_SIGN_ENTITLEMENTS: plists/Keyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Keyboard/InputxCore-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        OTHER_LDFLAGS: -linputx_core
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../core/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../core/target/aarch64-apple-ios-sim/release
