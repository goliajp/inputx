# Corpus digest log — append-only audit trail of every "eat" event
# for the inputx library files (pinyin, wubi, nihongo).
#
# Per 2026-06-03 治理 architecture (`.claude/PLAN-corpus-治理.md`):
#
#   - Library files are source-agnostic (no upstream identity in rows).
#     Per-event provenance lives here and ONLY here.
#
#   - Each digest event records:
#       event_id        — unique identifier (date + source name)
#       engine          — pinyin | wubi | nihongo
#       source_type     — self (we made it) | external (3rd-party)
#       source_name     — display name (e.g. "jieba-phrases-dict")
#       source_version  — upstream version tag or our own version
#       source_sha256   — sha256 of the upstream artifact (n/a for legacy)
#       ingested_at     — date
#       rows_added      — count attributed to this event
#       rows_rejected   — count rejected by garbage filter
#       notes           — free-text context
#
#   - Library rows themselves are source-agnostic ("digested" or "polish").
#     Row → event mapping is intentionally NOT recorded — the policy is
#     "结果内化到我们自己的库中，再不能有原来的影子".
#
# Adding a new event: append a new [[event]] block at the bottom. Never
# rewrite history.

version = 1

