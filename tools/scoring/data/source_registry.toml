# Corpus source registry — current state per known upstream source.
#
# Per 2026-06-03 corpus-治理 + corpus-digest design
# (.claude/PLAN-corpus-治理.md + .claude/PLAN-corpus-digest.md):
#
# This file is the THIRD persistence layer of the corpus pipeline,
# complementing:
#   1. library.tsv (per engine) — the truth, what runtime reads
#   2. digest_log.toml             — append-only event history
#   3. source_registry.toml (this) — current state per source, the
#                                    lookup table that automated
#                                    feeding workflows query
#
# Unlike digest_log.toml which is append-only history, this file is
# MUTABLE: each ingest event updates the corresponding source's row
# with the new version/sha/timestamp. The previous state is captured
# in the digest_log event chain — recoverable but no longer "current".
#
# Schema per source:
#   source_id            unique key
#   engine               pinyin | wubi | nihongo
#   source_type          self | external
#   source_name          display
#   fetch_kind           http | file | git | static
#   fetch_url            URL / path / commit
#   current_version      upstream version tag
#   current_sha256       upstream artifact sha (HEAD comparison)
#   last_event_id        pointer into digest_log
#   last_ingested_at     ISO 8601 timestamp
#   current_row_count    approximate active row count from this source
#   ingest_format        TSV parser to use
#   auto_update          whether automated-feeding workflows touch this
#   auto_fetch_schedule  hint to the scheduler
#   status               stable | watching | deprecated
#   notes                free text
#
# When implementing `corpus-digest add-source <manifest.toml>`, write
# new sources here. When running ingest, update the existing source's
# row atomically alongside digest_log append.

version = 1

# ─────────────────────────────────────────────────────────────────────
# Legacy anchor sources — one per engine. These hold the pre-治理
# ingestion lineage that the future digest tool will replace with
# real upstream sources (jieba, unihan, mozc, etc.). Status="watching"
# means: this is a placeholder; do not auto-update; future digest
# events will retire it by replacing rows incrementally.
# ─────────────────────────────────────────────────────────────────────

