notes = """
jieba 0.42.1+ 主词典 dict.txt (~350k 行)。MIT license。

格式 `word freq pos`,无 pinyin reading。corpus-digest 的 jieba_phrase
parser 使用 "safe reading only" 策略:仅当 word 的每个字都在
inputx-pinyin 的 reverse-index 里且**只有一个读音** (非多音字) 时,才
派生 code 并入候选。多音字词 (如"暖和" — 和有多读音) 一律 drop,留给
