source_id = "pinyin-legacy"
engine = "pinyin"
source_type = "self"
source_name = "legacy-merge"
fetch_kind = "static"
fetch_url = "n/a"
current_version = "pre-治理"
current_sha256 = "n/a"
last_event_id = "pinyin-legacy-2026-06-03"
last_ingested_at = "2026-06-03"
current_row_count = 397493
ingest_format = "simple_tsv"
auto_update = false
auto_fetch_schedule = "manual"
status = "watching"
notes = """
Pre-治理 anchor for the pinyin library. Will be retired incrementally
as real upstream sources (jieba-phrases-dict, unihan-readings, etc.)
get registered + ingested via the corpus-digest tool. The 397493 rows
are not per-source-attributed — that's the legacy era's only
accountability gap.
"""

