# Pinned corpus versions feeding the scoring pipeline. Bump entries
# here + re-run `make rebuild` to roll a new weights drop. Each entry
# includes a sha256 of the downloaded artifact so re-fetches are
# verified before extraction proceeds.
#
# Update protocol:
#   1. Bump version (and sha256) of one or more sources.
#   2. `make 01-fetch`  — downloads + verifies.
#   3. `make rebuild`   — full pipeline. Slow.
#   4. Review `reports/build-<new-version>.html` (07 validate output).
#   5. If gates pass + diff looks sane → commit + tag release.
#
# A copy of this file is stamped into the final weights.tsv header so
# every release is traceable to a specific corpus state.

