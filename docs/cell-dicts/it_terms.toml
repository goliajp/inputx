# Cell-dict pack · IT 术语(示范 · CP-5.2 step-1)
#
# Schema reference: docs/cell-dict-schema-2026-06-16.md
#
# Scope: a representative slice of common IT / cloud / DevOps terms
# typical for an engineering workstation. Step-1 ships a minimum pack
# (~35 entries) so the loader + production wiring can be validated
# end-to-end; the full ~500-entry pack lands in step-2.
#
# All entries use freq = 500_000 — a comfortable "lead the list" tier
# that beats most embedded L1 freq values for these multi-syllable
# terms while staying well below the 1_000_000 dominate-everything
# threshold.

[meta]
name = "IT 术语 · 示范包"
version = 1
author = "Inputx team"
description = "Common IT / cloud / DevOps Chinese terms — minimum step-1 pack"
license = "CC0-1.0"

